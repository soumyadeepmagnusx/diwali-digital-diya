version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --prefer-offline || npm install
    build:
      commands:
        - echo "Building Diwali Digital Diya production bundle for AWS Amplify..."
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
