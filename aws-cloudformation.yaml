AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS CloudFormation Template for Diwali Digital Diya - S3 Static Website with CloudFront Global CDN'

Parameters:
  ProjectName:
    Type: String
    Default: 'diwali-digital-diya'
    Description: 'Project name for resource tagging'

Resources:
  # 1. AWS S3 Bucket for Static Website Hosting
  DiwaliWebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3000
      Tags:
        - Key: Event
          Value: 'GDG-JISU-AWS-SBG-Diwali-Hackathon'
        - Key: ManagedBy
          Value: 'CloudFormation'

  # 2. S3 Bucket Policy for Public Read Access
  DiwaliBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DiwaliWebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub '${DiwaliWebsiteBucket.Arn}/*'

  # 3. AWS CloudFront Distribution for Global Low-Latency CDN
  DiwaliCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: 'CloudFront CDN for Diwali Digital Diya Website'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt DiwaliWebsiteBucket.RegionalDomainName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000

Outputs:
  WebsiteURL:
    Description: 'AWS S3 Static Website URL'
    Value: !GetAtt DiwaliWebsiteBucket.WebsiteURL
  CloudFrontDomain:
    Description: 'AWS CloudFront Global CDN URL'
    Value: !GetAtt DiwaliCloudFrontDistribution.DomainName
